# Curated metro groups: airports that are different codes but serve the same
# destination area. Grouping them means an open-jaw trip may fly into one and
# back out of another (e.g. LHR in, STN out).
#
# Only airports present in the vendored snapshot are used; unknown codes are
# ignored silently.

[metros.london]
display = "London"
airports = ["LHR", "LGW", "LCY", "STN", "LTN", "SEN"]

[metros.paris]
display = "Paris"
airports = ["CDG", "ORY", "BVA"]

