[project]
name = "flight-search"
version = "0.1.0"
description = "Weekend-getaway / open-jaw flight search on top of the fli (Google Flights) library"
requires-python = ">=3.12"
dependencies = [
    "airportsdata>=20261126",
    "flask>=3.1",
    "flights==0.11.1",
    "rich>=13.7",
    "tzdata>=2026.6",
    "waitress>=3.0",
]

[project.scripts]
flight-search = "flight_search.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flight_search"]

[dependency-groups]
dev = [
    "actionlint-py==1.7.12.25",
    "pytest>=8",
    "ruff==0.17.6",
]
e2e = [
    "pytest-playwright>=0.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not e2e'"
markers = ["e2e: browser tests with Playwright (uv run --group e2e pytest -m e2e)"]
