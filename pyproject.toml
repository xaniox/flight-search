[project]
name = "flight-search"
version = "0.1.0"
description = "Weekend-getaway / open-jaw flight search on top of the fli (Google Flights) library"
requires-python = ">=3.12"
dependencies = [
    # 0.9.0 on PyPI uses the GetShoppingResults/GetCalendarGraph RPCs, which
    # Google now answers with an empty payload. The page transport landed after
    # the last PyPI release, so pin the working commit.
    "flights @ git+https://github.com/punitarani/fli.git@881aee5ff4321e81ea2157cb44be94ce6a21dc1b",
    "rich>=13.7",
]

[project.scripts]
flight-search = "flight_search.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flight_search"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
